[project]
name = "mempalace-codex-plugin"
version = "0.1.0"
description = "Codex integration layer for MemPalace"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "ScreamWolf" }]
dependencies = ["mempalace"]

[project.scripts]
mempalace-codex-hook = "mempalace_codex.hook:main"
mempalace-codex-mcp = "mempalace_codex.mcp_launcher:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mempalace_codex"]

[tool.pytest.ini_options]
testpaths = ["tests"]
